name: "📊 capture benchmark"
description: "Capture benchmarks for the base and head."

inputs:
  base-repository:
    description: "Repository"
    required: true
  base-sha:
    description: "Base commit SHA"
    required: true
  head-sha:
    description: "Head commit SHA"
    required: true

outputs:
  artifact-id:
    description: "Results Artifact ID"
    value: ${{ steps.results.outputs.artifact-id }}

runs:
  using: composite
  steps:
    - name: "📥 check out base"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.base-repository }}
        ref: ${{ inputs.base-sha }}
        path: benchmark-base
        persist-credentials: false

    - name: "📥 install base dependencies"
      shell: bash
      working-directory: benchmark-base
      run: pnpm install --frozen-lockfile

    - name: "📦 build base"
      shell: bash
      working-directory: benchmark-base
      run: pnpm build

    - name: "📂 stage base output"
      shell: bash
      run: |
        mkdir -p dist
        cp -R benchmark-base/dist/. dist/

    - name: "📊 capture base benchmark"
      shell: bash
      run: pnpm bench:full --mode capture --reporter=default

    - name: "📦 build head"
      shell: bash
      run: pnpm build

    - name: "📊 compare benchmark"
      shell: bash
      run: pnpm bench:full --mode compare --reporter=default --reporter=github-actions

    - name: "📂 collect results"
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
      run: |
        mkdir -p benchmark-results/full/current
        cp .vitest/benchmarks/full/*.json benchmark-results/full/
        cp .vitest/benchmarks/full/current/*.json benchmark-results/full/current/
        node -e 'require("node:fs").writeFileSync("benchmark-results/measurement.json", JSON.stringify({base: process.env.BASE_SHA, head: process.env.HEAD_SHA}))'

    - name: "📤 upload results"
      id: results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: benchmark-results-${{ github.run_attempt }}
        path: benchmark-results/
        if-no-files-found: error
        retention-days: 1
