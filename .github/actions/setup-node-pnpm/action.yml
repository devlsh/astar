name: "⚙️ setup node and pnpm"
description: "install the dev toolchain and deps"

inputs:
  cache:
    description: "Restore pnpm caches"
    required: false
    default: "false"

outputs:
  store:
    description: "pnpm store path"
    value: ${{ steps.paths.outputs.store }}
  metadata:
    description: "pnpm metadata cache path"
    value: ${{ steps.paths.outputs.metadata }}
  cache-hit:
    description: "Whether cache was restored"
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: "Dependency cache key"
    value: ${{ steps.cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: "⚙️ set up node"
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        package-manager-cache: false

    - name: "⚙️ set up pnpm"
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: package.json
        run_install: false
        cache: false

    - name: "📂 locate pnpm caches"
      id: paths
      if: inputs.cache == 'true'
      shell: bash
      run: |
        store=$(pnpm store path --silent)
        metadata=$(pnpm cache path)

        for path in "$store" "$metadata"; do
          if [[ "$path" != /* || "$path" == *$'\n'* ]]; then
            echo "Expected a single absolute pnpm cache path" >&2
            exit 1
          fi
        done

        printf 'store=%s\nmetadata=%s\n' "$store" "$metadata" >> "$GITHUB_OUTPUT"

    - name: "📦 restore pnpm caches"
      id: cache
      if: inputs.cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.store }}
          ${{ steps.paths.outputs.metadata }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml') }}

    - name: "📥 install dependencies"
      shell: bash
      run: pnpm install --frozen-lockfile
